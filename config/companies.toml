# Companies whose public job boards the pipeline reads every morning.
#
# platform: greenhouse | lever | ashby
# slug:     the board name in the company's careers URL, e.g.
#             boards.greenhouse.io/<slug>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<slug>
# enabled:  set false to pause one without deleting it.
#
# This starting list is a guess: AI-forward companies with NYC or remote US
# roles, a few edtech and K-12 identity companies, and a few you've applied to
# before. Board names haven't been checked yet, because this build ran in a
# session that couldn't reach the job board APIs. Run
#     python -m hunt check-companies
# once from a session that can, and fix or disable any that fail.

